name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets are required for these jobs. A check that needs a credential to
# pass is a check that cannot run on a fork, so it does not belong here.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=apps/web
      - run: npm run lint --workspace=apps/web
      - run: npm run test --workspace=apps/web
      - run: npm run build --workspace=apps/web
      - name: Client bundle carries no server credential
        # Must run in the SAME job as the web build. It was once moved into a
        # job that never builds apps/web, where it exited 0 having scanned
        # nothing and reported green — a false trust claim.
        run: |
          BUNDLE=apps/web/.next
          if [ ! -d "$BUNDLE" ]; then
            echo "::error::$BUNDLE does not exist — this scan must run after the web build"
            exit 1
          fi
          fail=0
          for pattern in 'AQ\.[A-Za-z0-9_-]\{20,\}' 'GEMINI_API_KEY' 'generativelanguage' '@google/genai' 'BEGIN [A-Z ]*PRIVATE KEY' 'service_account'; do
            if grep -rIl "$pattern" "$BUNDLE" 2>/dev/null | head -1 | grep -q .; then
              echo "::error::Found '$pattern' in the client bundle"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then exit 1; fi
          echo "Scanned $(find "$BUNDLE" -type f | wc -l) files: no server credential or model SDK."
          echo "The Firebase Web config IS inlined here, and that is correct:"
          echo "it is a public browser identifier, not a secret."

  fixture:
    name: Demo fixture (typecheck · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The fixture is what every later phase indexes and generates against.
      # If it stops building, those phases are testing against a broken app.
      - run: npm run typecheck --workspace=fixtures/demo-hotel-app
      - run: npm run build --workspace=fixtures/demo-hotel-app
  api:
    name: API (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  secrets:
    name: No credentials in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for credential-shaped strings
        # Only two files are exempt, and neither can hold a real credential:
        # this workflow (it contains the patterns) and filters.py (it IS the
        # detector). Tests are NOT exempt — their fixtures are assembled at
        # runtime so no scanner-matching literal is ever committed.
        run: |
          if git grep -InE \
            'AIza[0-9A-Za-z_-]{20}|AQ\.[A-Za-z0-9_-]{30}|gh[pousr]_[A-Za-z0-9]{20}|github_pat_|BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}' \
            -- . ':!.github/workflows/ci.yml' \
               ':!services/api/src/mcpforge/security/filters.py'; then
            echo "::error::Credential-shaped string found in a tracked file"
            exit 1
          fi
          echo "No credential-shaped strings found."
      - name: Refuse a committed .env
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked"
            exit 1
          fi
          echo ".env is not tracked."
